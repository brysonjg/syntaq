<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Syntaq Test</title>
        <style>
            body, html {
                font-family: monospace;
                font-size: 20px;
                width: 100vw;
                height: 100vh;
                padding: 0;
                margin: 0;
                background-color: #1e1e1e;
            }

            pre {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
            }

            span.token {
                color: white;
            }

            span.token[type="Style_Seperator_Pair"] {
                color: blueviolet;
            }

            span.token[type="Style_Seperator_Array"] {
                color: limegreen;
            }

            span.token[type="Style_Float"],
            span.token[type="Style_Decimal"] {
                color: orange;
            }

            span.token[type="Style_Keyword"] {
                color: white;
                font-style: bold;
            }

            span.token[type="Style_String_Key"] {
                color: dodgerblue;
            }

            span.token[type="Style_String_Value"] {
                color: crimson;
            }

            span.token[type="Style_String_Key_Char"],
            span.token[type="Style_String_Value_Char"] {
                color: aqua;
            }

            span.token[type="Style_Error"] {
                color: red;
                text-decoration: underline;
            }
        </style>
    </head>
    <body>

        <pre></pre>

        <script src="./syntaqStateMachean.js" defer></script>
        <script src="./syntaq.js" defer></script>
        <script src="./language/json.js" defer></script>
        <script defer>
            window.addEventListener("DOMContentLoaded", () => {
                const text =
                    `{\n` +
                    `  "name": "Syntax Test",\n` +
                    `  "version": 1.2,\n` +
                    `  "enabled": true,\n` +
                    `  "count": 42,\n` +
                    `  "price": 19.99,\n` +
                    `  "tags": ["json", "test", "highlighting \\u0075d", 123, false, null,],\n` +
                    `  "nested": {\n` +
                    `    "users": [\n` +
                    `      { "id": 1, "name": "Alice", "scores": [10, 20, 30] },\n` +
                    `      { "id": 2, "name": "Bo\\"b", "scores": [15, 25.5, 35], }\n` +
                    `      { "id": 3, "name": "Charlie \\n", "active": true }\n` +
                    `    ],\n` +
                    `    "matrix": [[1,2,3], [4,5,6], [7,8,9]],\n` +
                    `    "misc": { "empty": {}, "list": [], "value": .75 }\n` +
                    `  },\n` +
                    `  "message": 'Single quotes are invalid in JSON',\n` +
                    `  "unicode": "😀 π こんにちは",\n` +
                    `  "missingEnd": { "a": 1e, "b": 2}\n` +
                    `}`;

                const syntax = syntaq.tokenize(text, "json");
                const pre = document.querySelector("pre");

                console.log(syntax)

                syntax.forEach((token) => {
                    const span = document.createElement("span");
                    span.className = "token";
                    span.setAttribute("type", token.type);
                    span.textContent = token.content
                    pre.appendChild(span)
                });
            });
        </script>
    </body>
</html>
