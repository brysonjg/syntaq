<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Syntaq Test</title>
        <style>
            body, html {
                font-family: monospace;
                font-size: 15px;
                width: 100vw;
                height: 100vh;
                padding: 0;
                margin: 0;
                background-color: #1e1e1e;
            }

            pre {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
            }

            span.token {
                color: white;
            }

            span.token.bold {
                font-weight: bold;
            }

            span.token.underline {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>

        <pre></pre>

        <script src="../syntaqRules.js" defer></script>
        <script src="../syntaqStateMachean.js" defer></script>
        <script src="../syntaq.js" defer></script>
        <script src="../language/json.js" defer></script>
        <script src="./styles.js" defer></script>
        <script src="./test.js" defer></script>
        <script defer>
            window.addEventListener("DOMContentLoaded", () => {
                const syntax = syntaq.tokenize(text, language);
                const pre = document.querySelector("pre");

                const grammar = syntaq.grammarize(syntaq.languages[language]);
                const itemDatas = grammar.itemDatas;

                syntax.forEach((token) => {
                    const span = document.createElement("span");
                    span.classList.add("token");

                    const tokenData = itemDatas[token.type];
                    const styleName = tokenData.defStyleNum;

                    if (!styleName) {
                        throw new Error(`Token type "${token.type}" has no defStyleNum`);
                    }

                    const style = styles[styleName];
                    span.style.color = style.color;
                    if (style.bold) span.classList.add("bold");
                    if (style.underline) span.classList.add("underline");

                    span.textContent = token.content;
                    pre.appendChild(span);
                });
            });
        </script>
    </body>
</html>
