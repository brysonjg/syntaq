<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Syntaq Test</title>
        <style>
            body, html {
                width: 100vw;
                height: 100vh;
                padding: 0;
                margin: 0;
                background-color: #1e1e1e;
                font-family: monospace;
                font-size: 15px;
            }

            pre {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
            }

            span.token {
                color: white;
            }

            span.token.bold {
                font-weight: bold;
            }

            span.token.underline {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>

        <pre></pre>

        <script src="../syntaqRules.js" defer></script>
        <script src="../syntaqStateMachean.js" defer></script>
        <script src="../syntaq.js" defer></script>

        <script src="../language/json.js" defer></script>
        <script src="../language/diff.js" defer></script>

        <script src="./colorData.js" defer></script>
        <script src="./testData.js" defer></script>
        <script defer>
            window.addEventListener("DOMContentLoaded", () => {
                const pre = document.querySelector("pre");

                const syntax = syntaq.tokenize(text, language);

                const grammar = syntaq.grammarize(syntaq.languages[language]);
                const itemDatas = grammar.itemDatas;

                syntax.forEach((token) => {
                    const span = document.createElement("span");
                    span.classList.add("token");

                    const tokenData = itemDatas[token.type];
                    const tokenType = tokenData.defStyleNum;

                    if (!tokenType) {
                        throw new Error(`Token type "${token.type}" has no defStyleNum`);
                    }

                    const styleData = typeColors[tokenType];

                    if (!styleData) {
                        throw new Error(`Token type "${tokenType}" has no attribute in typeColors`);
                    }

                    span.style.color = styleData.color;
                    if (styleData.bold) span.classList.add("bold");
                    if (styleData.underline) span.classList.add("underline");

                    span.textContent = token.content;

                    pre.appendChild(span);
                });
            });
        </script>
    </body>
</html>
